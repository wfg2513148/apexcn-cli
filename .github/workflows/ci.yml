name: PowerShell relative install reproduction

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: true
        type: string
      archive_sha256:
        required: true
        type: string

permissions:
  contents: read

jobs:
  powershell-relative-install:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fe8f68405a029fb7f40736fa196be9daa0b615c9
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: qa-support
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Reproduce relative destination failure against the unchanged installer
        shell: bash
        run: |
          set -euo pipefail
          pwsh --version
          cp qa-support/qa/install-agent-relative.test.ts test/install-agent.test.ts
          ./node_modules/.bin/vitest run test/install-agent.test.ts -t 'PowerShell installer supports relative destinations' --no-color
