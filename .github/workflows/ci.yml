name: CI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published candidate tag to verify on Windows
        required: true
        default: v1.1.6
        type: string
      archive_sha256:
        description: Independently accepted candidate archive SHA-256
        required: true
        default: 3f8bd2b9eb231b65a365c9fde1f5798d2b65e1faef3694d922a2d243c13fcb18
        type: string
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check:release
      - run: npm run eval:rag
      - run: node scripts/eval-rag.mjs --report --output reports/rag-eval.json
      - uses: actions/upload-artifact@v4
        with:
          name: rag-eval-report
          path: reports/rag-eval.json
  windows-installer:
    name: Windows 2022 / ${{ matrix.name }}
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows PowerShell 5.1
            id: windows-powershell-5-1
            executable: powershell.exe
          - name: PowerShell 7
            id: powershell-7
            executable: pwsh.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run test/install-agent.test.ts test/lifecycle-agent.test.ts test/release-version.test.ts
        env:
          APEXCN_TEST_POWERSHELL: ${{ matrix.executable }}
          APEXCN_WINDOWS_REPORT_PATH: reports/${{ matrix.id }}-lifecycle.json
      - name: Verify the published Windows installation and update command
        if: github.event_name == 'workflow_dispatch'
        run: |
          gh release download $env:APEXCN_TEST_RELEASE_TAG --repo wfg2513148/apexcn-cli --dir release-assets
          node scripts/validate-windows-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          APEXCN_TEST_RELEASE_TAG: ${{ inputs.release_tag }}
          APEXCN_TEST_ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
          APEXCN_TEST_POWERSHELL: ${{ matrix.executable }}
          APEXCN_WINDOWS_RELEASE_REPORT: reports/${{ matrix.id }}-release.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.id }}-lifecycle
          path: reports/${{ matrix.id }}-*.json
          if-no-files-found: warn
